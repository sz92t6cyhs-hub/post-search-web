<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投稿検索</title>
<meta name="description" content="Blueskyの公開投稿をキーワードで検索">
<meta name="theme-color" content="#0a7aff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="投稿検索">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>投稿検索</h1>
  <form id="f" role="search">
    <input id="q" type="search" placeholder="キーワードを入力" enterkeyhint="search" autocomplete="off" required>
    <button type="submit">検索</button>
  </form>
  <div class="sort" role="radiogroup" aria-label="並び順">
    <label><input type="radio" name="sort" value="latest" checked> 新着順</label>
    <label><input type="radio" name="sort" value="top"> 人気順</label>
  </div>
</header>
<main>
  <p id="status" class="status">キーワードでBlueskyの公開投稿を検索できます。</p>
  <ul id="results"></ul>
  <div id="sentinel"></div>
</main>
<script src="app.js"></script>
</body>
</html>
